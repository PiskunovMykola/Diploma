<div class="card mb-4 border-0 shadow-sm search-bar">
  <div class="card-body p-3">
    <div class="row g-2 align-items-center">
      
      <div class="col-md-8">
        <div class="input-group">
          <span class="input-group-text bg-white text-muted border-end-0">
            <i class="fa-solid fa-filter"></i>
          </span>
          <select [(ngModel)]="FilterField" class="form-select" style="max-width: 140px; border-left: none;">
            <option value="Technologies">Tech</option>
            <option value="Location">Country</option>
            <option value="Type">Type</option>
          </select>

          <input [(ngModel)]="FilterValue" type="text" class="form-control" placeholder="Type to search...">
          
          <button type="button" class="btn btn-primary" (click)="onFilter()">
            <i class="fa-solid fa-magnifying-glass"></i> Search
          </button>
          <button type="button" class="btn btn-outline-secondary" (click)="onFilterClear()">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      </div>

      <div class="col-md-4">
        <div class="d-flex justify-content-md-end">
          <div class="input-group" style="max-width: 250px;">
            <span class="input-group-text bg-light">Sort by</span>
            
            <select [(ngModel)]="SortbyParam" class="form-select">
              <option value="Name">Name</option>
              <option value="Goal">Goal</option>
            </select>

            <button type="button" class="btn btn-outline-dark" (click)="onSortDirection()">
              <i *ngIf="SortDirection === 'asc'" class="fas fa-sort-alpha-down"></i>
              <i *ngIf="SortDirection === 'desc'" class="fas fa-sort-alpha-up"></i>
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="row">
  <div *ngFor="let project of projects | filter: FilterValue: FilterField | sort:[SortbyParam, SortDirection]" class="col-sm-4">
    <div class="shadow-hover mb-4">
      <app-project-card [project]="project"></app-project-card>
    </div>
  </div>
</div>
