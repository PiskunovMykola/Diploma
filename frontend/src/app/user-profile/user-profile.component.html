<div class="row">
    <div class="col-6 m-auto">
    <div class="card m-auto">
      <div class="card-header">
        <h3>User Profile</h3>
      </div>
      <div class="card-body">
        <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
          
          <div class="form-group col-12">
            <label for="image">Profile Image</label>
            <input type="file" class="form-control" (change)="onImageSelected($event)">
            
            <div *ngIf="previewImage" class="mt-2 text-center">
                <img [src]="previewImage" alt="Profile Image" class="img-thumbnail" style="max-height: 200px;">
            </div>
          </div>

          <div class="form-group col-12">
            <label for="userName" class="form-label">Name</label>
            <input type="text" class="form-control" formControlName="userName">
          </div>

          <div class="form-group col-12">
            <label for="email" class="form-label">Email</label>
            <input type="text" class="form-control" formControlName="email">
            <small class="text-muted">Email cannot be changed</small>
          </div>

          <div class="form-group col-12">
            <label for="mobile" class="form-label">Mobile</label>
            <input type="text" class="form-control" formControlName="mobile">
          </div>

          <div class="form-group col-12">
              <label for="bio" class="form-label">Bio</label>
              <textarea class="form-control" rows="3" formControlName="bio"></textarea>
          </div>

          <br>
          <div class="form-group col-12">
            <button type="submit" class="btn btn-primary" [disabled]="!profileForm.valid || isImageUploading">
                {{ isImageUploading ? 'Uploading...' : 'Update Profile' }}
            </button>
            <button type="button" class="btn btn-secondary ml-2" routerLink="/">Cancel</button>
          </div>

        </form>
      </div>
    </div>
    </div>
</div>
