<div class="container mt-5">
    <div class="card">
      <div class="card-header">
        <h3>User Profile</h3>
      </div>
      <div class="card-body" *ngIf="user; else noUser">
        <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
          <!-- Profile Image -->
          <div class="form-group mb-3">
            <label for="profileImage">Profile Image</label>
            <input type="file" id="profileImage" class="form-control" (change)="onImageSelected($event)">
            <div *ngIf="selectedImage" class="mt-2">
              <img [src]="selectedImage" alt="Profile Image" class="img-thumbnail" width="100">
            </div>
          </div>
  
          <!-- User Name -->
          <div class="form-group mb-3">
            <label for="userName" class="form-label">Name</label>
            <input type="text" id="userName" class="form-control" formControlName="userName">
          </div>
  
          <!-- Email (Readonly) -->
          <div class="form-group mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" class="form-control" formControlName="email" readonly>
          </div>
  
          <!-- Mobile -->
          <div class="form-group mb-3">
            <label for="mobile" class="form-label">Mobile</label>
            <input type="text" id="mobile" class="form-control" formControlName="mobile">
          </div>
  
          <!-- Bio -->
          <div class="form-group mb-3">
            <label for="bio">Bio</label>
            <textarea id="bio" class="form-control" formControlName="bio" rows="4" maxlength="500"></textarea>
          </div>
  
          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary" [disabled]="profileForm.invalid">Update Profile</button>
        </form>
      </div>
      <ng-template #noUser>
        <p>No user data available. Please register.</p>
      </ng-template>
    </div>
  </div>
