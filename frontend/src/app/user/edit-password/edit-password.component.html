<div class="container mt-5">
    <div class="row">
        <div class="col-md-6 m-auto">
            <div class="card">
                <div class="card-header bg-warning text-white">
                    <h3>Change Password</h3>
                </div>
                <div class="card-body">
                    
                    <form [formGroup]="passwordForm" *ngIf="passwordForm" (ngSubmit)="onSubmit()">

                        <div class="form-group mb-3">
                            <label for="password" class="form-label">New Password</label>
                            <input type="password" 
                                   id="password" 
                                   class="form-control" 
                                   formControlName="password"
                                   [ngClass]="{'is-invalid': password && password.invalid && password.touched}">
                            <div class="invalid-feedback" *ngIf="password && password.hasError('required')">
                                Password is required
                            </div>
                            <div class="invalid-feedback" *ngIf="password && password.hasError('minlength')">
                                Password must be at least 8 characters
                            </div>
                            <div class="invalid-feedback" *ngIf="password && password.hasError('pattern')">
                                Must contain at least 1 number and 1 special char (!&#64;#$%^&*)
                            </div>
                        </div>
  
                        <div class="form-group mb-3">
                            <label for="confirmPassword" class="form-label">Confirm New Password</label>
                            <input type="password" 
                                   id="confirmPassword" 
                                   class="form-control" 
                                   formControlName="confirmPassword"
                                   [ngClass]="{'is-invalid': passwordForm.hasError('notmatched') && confirmPassword && confirmPassword.touched}">
                            <div class="invalid-feedback">
                                Passwords do not match
                            </div>
                        </div>
  
                        <div class="form-group">
                            <button type="submit" class="btn btn-warning" [disabled]="!passwordForm.valid || isSubmitting">
                                {{ isSubmitting ? 'Changing...' : 'Change Password' }}
                            </button>
                            <button type="button" class="btn btn-secondary ms-2" routerLink="/">Cancel</button>
                        </div>
                        
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
