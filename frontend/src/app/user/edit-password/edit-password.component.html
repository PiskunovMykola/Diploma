<div class="container mt-5">
    <div class="card">
      <div class="card-header">
        <h3>Change Password</h3>
      </div>
      <div class="card-body">
        <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
          <div class="form-group mb-3">
            <label for="currentPassword" class="form-label">Current Password</label>
            <input type="password" id="currentPassword" class="form-control" formControlName="currentPassword" required>
          </div>
  
          <div class="form-group mb-3">
            <label for="newPassword" class="form-label">New Password</label>
            <input type="password" id="newPassword" class="form-control" formControlName="newPassword" required>
          </div>
  
          <div class="form-group mb-3">
            <label for="confirmNewPassword" class="form-label">Confirm New Password</label>
            <input type="password" id="confirmNewPassword" class="form-control" formControlName="confirmNewPassword" required>
          </div>
  
          <button type="submit" class="btn btn-warning" [disabled]="passwordForm.invalid">Change Password</button>
        </form>
      </div>
    </div>
  </div>
